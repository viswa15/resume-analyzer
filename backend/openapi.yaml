openapi: 3.0.3
info:
  title: DeepKlarity Resume Analyzer API
  version: "2.0.0"
  description: >
    AI-powered resume analysis, JD matching, resume chat, and bullet-point
    rewriting. All /resumes endpoints require a Bearer JWT from /auth/login
    or /auth/register.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string }
            name: { type: string, nullable: true }
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /auth/register:
    post:
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { description: Invalid credentials }
  /auth/me:
    get:
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Not authenticated }
  /resumes/upload:
    post:
      summary: Upload and analyze a PDF resume
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '201': { description: Resume analyzed and stored }
        '400': { description: No file uploaded / invalid file type }
        '422': { description: PDF had no extractable text }
  /resumes:
    get:
      summary: List the current user's resumes (paginated, searchable)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search across file name, candidate name, and email
      responses:
        '200': { description: Paginated resume list }
  /resumes/{id}:
    get:
      summary: Get one resume's full analysis
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Resume details }
        '404': { description: Not found / not owned by this user }
  /resumes/{id}/match:
    post:
      summary: Score a resume against a pasted job description (ATS-style)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobDescription]
              properties:
                jobDescription: { type: string }
      responses:
        '200': { description: "Match score, keywords, ATS issues, recommendation" }
  /resumes/{id}/chat:
    get:
      summary: Get the chat history for a resume
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: List of chat messages }
    post:
      summary: Ask a question grounded in a specific resume
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        '200': { description: AI-generated answer }
  /resumes/rewrite:
    post:
      summary: Rewrite a single resume bullet point
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bullet]
              properties:
                bullet: { type: string }
                role: { type: string }
      responses:
        '200': { description: "Rewritten bullet, alternatives, and rationale" }
  /resumes/{id}/jobs:
    get:
      summary: Find and rank live job postings against a resume's skills
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: what
          schema: { type: string }
          description: Search keywords; defaults to the resume's top technical skills.
        - in: query
          name: where
          schema: { type: string }
          description: Location filter (optional).
      responses:
        '200': { description: "Ranked job postings with a per-job skill-overlap score" }
        '404': { description: Not found / not owned by this user }
        '503': { description: Job search is not configured (missing Adzuna credentials) }
  /resumes/{id}/cover-letter:
    post:
      summary: Draft a cover letter tailored to a job description, grounded in the resume
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobDescription]
              properties:
                jobDescription: { type: string }
                companyName: { type: string }
                tone: { type: string, enum: [professional, enthusiastic, concise] }
      responses:
        '200': { description: Drafted cover letter text }
  /resumes/{id}/ats:
    post:
      summary: Rule-based ATS readiness check (no LLM call); optionally scores keyword coverage against a job description
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jobDescription: { type: string, maxLength: 20000 }
      responses:
        '200': { description: "Score (0-100), grade, per-check results, and optional keywordCoverage" }
        '404': { description: Resume not found }
  /resumes/{id}/chat/stream:
    post:
      summary: Ask a question about the resume; the answer streams back as Server-Sent Events
      description: >
        Emits `data: {"delta": "..."}` events as text is generated, then `event: done` with the full
        answer (saved to chat history), or `event: error` if generation fails (nothing is saved).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 2000 }
      responses:
        '200': { description: text/event-stream }
        '404': { description: Resume not found }
  /resumes/{id}/tailor:
    post:
      summary: Rewrite the resume for a job description (one Gemini call) and compare ATS score / keyword coverage before and after
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobDescription]
              properties:
                jobDescription: { type: string, minLength: 30, maxLength: 20000 }
      responses:
        '200': { description: "{ document, comparison: { before, after } }" }
  /resumes/{id}/tailor/pdf:
    post:
      summary: Render a (possibly edited) tailored document as an ATS-friendly PDF (no LLM call)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object, description: The `document` returned by /tailor }
      responses:
        '200': { description: application/pdf }
  /insights:
    get:
      summary: Rating history, JD match history, most-missed skills and application funnel for the signed-in user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Aggregated insights }
  /applications:
    get:
      summary: List the caller's tracked job applications
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [saved, applied, interviewing, offer, rejected, withdrawn] }
      responses:
        '200': { description: List of tracked applications }
    post:
      summary: Add a tracked application
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, roleTitle]
              properties:
                company: { type: string }
                roleTitle: { type: string }
                jobUrl: { type: string }
                status: { type: string, enum: [saved, applied, interviewing, offer, rejected, withdrawn] }
                notes: { type: string }
                appliedAt: { type: string }
                resumeId: { type: integer }
      responses:
        '201': { description: The created application }
  /applications/{id}:
    patch:
      summary: Update fields on a tracked application
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company: { type: string }
                roleTitle: { type: string }
                jobUrl: { type: string }
                status: { type: string, enum: [saved, applied, interviewing, offer, rejected, withdrawn] }
                notes: { type: string }
                appliedAt: { type: string }
      responses:
        '200': { description: The updated application }
        '404': { description: Not found / not owned by this user }
    delete:
      summary: Delete a tracked application
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found / not owned by this user }
