# Render Blueprint for the Express + Postgres backend.
# Deploy: push this repo to GitHub, then in Render choose "New +" -> "Blueprint" and
# point it at this repo. Render reads this file and provisions both resources below.
# Render prompts for the sync: false values (GOOGLE_API_KEY, ADZUNA_*, CORS_ORIGIN) when
# you create the Blueprint; they're deliberately not stored in this file.
databases:
  - name: resume-analyzer-db
    plan: free
    databaseName: resume_analyzer
    user: resume_analyzer

services:
  - type: web
    name: resume-analyzer-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash,gemini-flash-latest,gemini-flash-lite-latest
      - key: GEMINI_RPM_LIMIT
        value: "5"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: in
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
